<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Glora Logo">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0E0E"/>
      <stop offset="100%" stop-color="#060606"/>
    </linearGradient>
    <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F4F4F1"/>
      <stop offset="100%" stop-color="#E2E2DE"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Fond sombre épuré -->
  <rect width="512" height="512" rx="32" fill="url(#bgGrad)"/>
  <rect width="512" height="512" rx="32" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Glyphe G hexagonal Glora lissé haute précision -->
  <path d="M 339.1 157 L 256 109 L 172.9 157 L 172.9 253 L 256 301 L 339.1 253 L 339.1 205 H 269"
        fill="none"
        stroke="url(#strokeGrad)"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#subtleGlow)"/>

  <!-- Typographie Glora équilibrée -->
  <text x="256" y="396" text-anchor="middle" fill="#FFFFFF"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="44" font-weight="700" letter-spacing="14">GLORA</text>
  <text x="256" y="428" text-anchor="middle" fill="#8A8A8A"
        font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="12" font-weight="500" letter-spacing="5">CRÉATION DE SITES WEB</text>
</svg>
