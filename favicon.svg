<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="gStroke" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#ECECEC"/>
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Fond squircle sombre avec contour délicat pour lisibilité sur onglets clairs et sombres -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  <rect width="64" height="64" rx="16" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.2"/>
  
  <!-- Glyphe G hexagonal Glora lissé et centré -->
  <path d="M51.9 20.5 L32 9 L12.1 20.5 L12.1 43.5 L32 55 L51.9 43.5 L51.9 32 H34.6"
        fill="none"
        stroke="url(#gStroke)"
        stroke-width="5.4"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#subtleGlow)"/>
</svg>

